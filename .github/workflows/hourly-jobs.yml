# Runs the site's timed jobs every hour (app/api/cron/hourly): trips short of people are called off, and so on.
# Needs the repository secret CRON_SECRET (the same value as CRON_SECRET on Vercel Production).
# Without the secret the step is skipped, so forks and an unset repo stay quiet.
name: Hourly jobs

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the hourly job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping"; exit 0; fi
          curl --fail-with-body -sS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" https://www.chillwaa.com/api/cron/hourly
