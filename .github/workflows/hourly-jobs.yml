# Manual run of the site's hourly jobs (app/api/cron/hourly). Since BE-471 (2026-11-25, Vercel Pro) Vercel Cron calls
# the route every hour (vercel.json); this workflow stays only for a run by hand (Actions > Hourly jobs > Run workflow).
# Needs the repository secret CRON_SECRET (the same value as CRON_SECRET on Vercel Production).
name: Hourly jobs

on:
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the hourly job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping"; exit 0; fi
          curl --fail-with-body -sS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" https://www.chillwaa.com/api/cron/hourly
