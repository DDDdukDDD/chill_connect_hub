name: Weekly jobs

# Monday 03:17 Bangkok (Sunday 20:17 UTC): every อีเวนต์ source is scraped once (app/api/cron/weekly).
# New items wait in the admin review queue. A second run within 6 days does nothing.
on:
  schedule:
    - cron: '17 20 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call the weekly job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping"; exit 0; fi
          curl --fail-with-body -sS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" https://www.chillwaa.com/api/cron/weekly
