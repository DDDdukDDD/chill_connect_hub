name: Weekly jobs

# Manual run of the weekly อีเวนต์ scrape (app/api/cron/weekly). Since BE-471 (2026-11-25, Vercel Pro) Vercel Cron calls
# the route Monday 03:17 Bangkok (vercel.json); this workflow stays only for a run by hand.
# New items wait in the admin review queue. A second run within 6 days does nothing.
on:
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call the weekly job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping"; exit 0; fi
          curl --fail-with-body -sS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" https://www.chillwaa.com/api/cron/weekly
