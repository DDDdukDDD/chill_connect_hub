# The iPhone app (ios-app/, docs/IOS_APP.md) built on a cloud Mac, since no one on the team has a Mac.
# simulator: an unsigned simulator build, to prove the Xcode project compiles after every change to ios-app/.
# testflight: a signed build uploaded to TestFlight, by hand (Actions -> iOS build -> Run workflow) or on a push to
# main that changes ios-app/. Signing is cloud-managed by Apple: the archive is built unsigned and Xcode signs it
# while exporting with the App Store Connect API key from repository secrets (APP_STORE_CONNECT_ISSUER_ID,
# APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_KEY_P8). No certificate or profile is stored. Build number = run number.
# macOS minutes count ten times on a private repository, so it runs only when ios-app/ changes or by hand.
name: iOS build

on:
  push:
    branches: [claude, main]
    paths: ['ios-app/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - name: Use the newest released Xcode on the runner
        # Apple warning 90725: from April 2027 uploads need the iOS 27 SDK (Xcode 27). macos-latest can default to an
        # older Xcode, so pick the highest non-beta one installed and print it.
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -Eiv 'beta|rc|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Copy settings and plugins into the Xcode project
        run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight || github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: simulator
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      TEAM_ID: NW64D6UX4Z
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - name: Use the newest released Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -Eiv 'beta|rc|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Copy settings and plugins into the Xcode project
        run: npx cap sync ios
      - name: Write the API key file
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          test -n "$KEY_ID" && test -n "$ISSUER_ID" && test -n "$KEY_P8" || { echo "App Store Connect secrets are missing"; exit 1; }
          echo "KEY_PATH=$RUNNER_TEMP/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
      - name: Archive (unsigned; Apple signs it in the next step)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -40
          test "${PIPESTATUS[0]}" -eq 0
      # An unsigned archive carries no entitlements, so Apple's re-signing would drop push (BE-428). An ad-hoc
      # signature with App.entitlements puts them in the binary; the export keeps what the profile allows.
      - name: Put the entitlements (push) into the archived app
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign --force --sign - --entitlements ios/App/App/App.entitlements --generate-entitlement-der "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/entitlements.plist"
          grep -q "aps-environment" "$RUNNER_TEMP/entitlements.plist" || { echo "::error title=Entitlements::aps-environment missing from the archived app"; exit 1; }
      - name: Sign and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || code=$?
          tail -60 "$RUNNER_TEMP/export.log"
          # Error lines become annotations, readable on the public run page without signing in.
          if [ "${code:-0}" -ne 0 ]; then
            grep -iE "error|fail|denied|permission|not found|no account|no profile" "$RUNNER_TEMP/export.log" \
              | tail -10 | while IFS= read -r line; do echo "::error title=Export::${line:0:900}"; done || true
          fi
          exit "${code:-0}"
      - name: Remove the API key file
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
