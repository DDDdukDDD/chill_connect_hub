# The iPhone app (ios-app/, docs/IOS_APP.md) built on a cloud Mac, since no one on the team has a Mac.
# Step 1 (now): an unsigned simulator build, to prove the Xcode project compiles after every change to ios-app/.
# Step 2 (once the Apple Developer Program is active): a signed build uploaded to TestFlight with the App Store Connect
# API key kept in repository secrets (APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_KEY_P8).
# macOS minutes count ten times on a private repository, so it runs only when ios-app/ changes or by hand.
name: iOS build

on:
  push:
    branches: [claude, main]
    paths: ['ios-app/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - name: Xcode in use
        run: xcodebuild -version
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Copy settings and plugins into the Xcode project
        run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
