<!doctype html>
<!-- Google Play feature graphic, 1024x500. Make the PNG: see docs/PLAY_STORE_LISTING.md -->
<html><head><meta charset="utf-8">
<!-- The wordmark's own font, as on the site (components/BrandWordmark.tsx) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block">
<style>
@font-face { font-family: Plex; font-weight: 700; src: url("../../assets/fonts/IBMPlexSansThai-Bold.ttf"); }
@font-face { font-family: Plex; font-weight: 500; src: url("../../assets/fonts/IBMPlexSansThai-Medium.ttf"); }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
body {
  font-family: Plex, sans-serif; position: relative; color: #2A1A12;
  background:
    radial-gradient(circle at 76% 48%, rgba(255,190,140,.55), rgba(255,190,140,0) 46%),
    radial-gradient(circle at 6% 4%, rgba(255,255,255,.9), rgba(255,255,255,0) 40%),
    linear-gradient(135deg, #FFF6EE 0%, #FFE9D9 50%, #FFD9BF 100%);
}
.ring { position: absolute; border-radius: 50%; border: 2px solid rgba(234,88,12,.10); }

/* Brand side */
.brand { position: absolute; left: 60px; top: 50%; transform: translateY(-50%); width: 390px; text-align: center; }
.lockup { display: flex; flex-direction: column; align-items: center; gap: 34px; }
/* The app icon in a soft two-step white halo, centred over the name (owner 2026-11-21) */
.icon { width: 112px; height: 112px; border-radius: 29px; display: block;
  box-shadow: 0 0 0 10px rgba(255,255,255,.7), 0 0 0 22px rgba(255,255,255,.35), 0 22px 44px rgba(200,80,20,.30); }
/* The site's wordmark (BE-191): "Chill" green, three dots growing from green to orange, "Waa" orange */
h1 { margin: 0; display: inline-flex; align-items: baseline; font-family: "Plus Jakarta Sans", sans-serif;
     font-size: 68px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: #128A64; white-space: nowrap; }
h1 .dots { display: inline-flex; align-items: baseline; gap: .13em; margin: 0 .15em; }
h1 .dots i { display: inline-block; border-radius: 50%; }
h1 .waa { color: #EA5A1A; }
.tag { margin: 16px 0 0; font-size: 31px; line-height: 1.3; font-weight: 500; color: #3D2A1F; }
.sub { margin: 18px 0 0; font-size: 20px; font-weight: 500; color: #7C6A5E; letter-spacing: .2px; }

/* Moment cards: each shows one scene of public/hero-bg-lifestyle.jpg (scenes start at x 0, 459, 918; 458 wide) */
.card {
  position: absolute; border: 7px solid #fff; border-radius: 26px; overflow: hidden;
  background-image: url("../../public/hero-bg-lifestyle.jpg"); background-repeat: no-repeat;
  box-shadow: 0 22px 48px rgba(170,70,20,.26), 0 4px 10px rgba(170,70,20,.12);
}
.cafe  { left: 512px; top: 104px; width: 196px; height: 268px; transform: rotate(-9deg);
         background-size: 798px auto; background-position: -35px -174px; } /* starts below the shop sign (a real brand name) */
.board { left: 818px; top: 100px; width: 196px; height: 268px; transform: rotate(8deg);
         background-size: 757px auto; background-position: -536px -100px; }
.run   { left: 640px; top: 74px; width: 232px; height: 316px; transform: rotate(-1.5deg);
         background-size: 697px auto; background-position: -233px -66px; z-index: 2; }

/* Little bits of the app's own UI */
.chip { position: absolute; z-index: 3; display: flex; align-items: center; gap: 8px; border-radius: 999px;
        font-weight: 700; box-shadow: 0 10px 24px rgba(170,70,20,.22); white-space: nowrap; }
.xp { left: 604px; top: 62px; padding: 8px 16px 8px 10px; background: #FFD43B; color: #7A3A00; font-size: 21px; transform: rotate(-6deg); }
.xp svg { width: 24px; height: 24px; }
.join { left: 668px; top: 360px; padding: 8px 18px 8px 8px; background: #fff; color: #1F2937; font-size: 19px; }
.faces { display: flex; }
.faces i { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #fff; margin-left: -9px;
           background-image: url("../../public/hero-bg-lifestyle.jpg"); background-repeat: no-repeat; background-size: 578px auto; }
/* The cards, chips and all: a little smaller and away from the right edge */
.stack { position: absolute; inset: 0; transform: translateX(-30px) scale(.92); transform-origin: 760px 250px; }
.faces i:first-child { margin-left: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #16A34A; }
.heart { right: 22px; top: 52px; padding: 8px 14px 8px 11px; background: #fff; color: #E11D48; font-size: 19px; transform: rotate(6deg); }
.heart svg { width: 20px; height: 20px; }
</style></head>
<body>
<div class="ring" style="width:620px;height:620px;left:450px;top:-60px"></div>
<div class="ring" style="width:880px;height:880px;left:320px;top:-190px;border-color:rgba(255,255,255,.08)"></div>

<div class="brand">
  <div class="lockup">
  <img class="icon" src="../store_icon.png" alt="">
  <h1 aria-label="Chillwaa">Chill<span class="dots"><i style="width:.18em;height:.18em;background:#1DB584"></i><i style="width:.22em;height:.22em;background:#F59A6B"></i><i style="width:.27em;height:.27em;background:#EA5A1A"></i></span><span class="waa">Waa</span></h1>
  </div>
  <p class="tag">โซเชียลคนชอบออกไปใช้ชีวิต</p>
  <p class="sub">ตี้ · อีเวนต์ · ที่เที่ยว · ชาเลนจ์</p>
</div>

<div class="stack">
<div class="card cafe"></div>
<div class="card board"></div>
<div class="card run"></div>

<div class="chip xp">
  <svg viewBox="0 0 24 24"><path fill="#F08C00" d="M12 2l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
  +50 XP
</div>
<div class="chip heart">
  <svg viewBox="0 0 24 24"><path fill="#E11D48" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
  128
</div>
<div class="chip join">
  <span class="faces">
    <i style="background-position:-46px -176px"></i>
    <i style="background-position:-137px -170px"></i>
    <i style="background-position:-500px -137px"></i>
    <i style="background-position:-542px -181px"></i>
  </span>
  <span class="dot"></span>
  เข้าร่วมตี้แล้ว 6/8
</div>
</div>
</body></html>
